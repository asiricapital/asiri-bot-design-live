<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asiri Capital - محفظة الاستثمار الذكية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1f3a;
            --secondary: #0f1428;
            --accent: #00d4ff;
            --success: #00ff88;
            --danger: #ff3366;
            --warning: #ffaa00;
            --text: #ffffff;
            --text-secondary: #a0aec0;
            --border: #2d3561;
        }

        body {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }

        .header {
            background: rgba(15, 20, 40, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent);
        }

        .btn-add {
            background: linear-gradient(135deg, var(--accent), var(--success));
            border: none;
            color: var(--primary);
            padding: 0.8rem 1.6rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .stock-card {
            background: linear-gradient(135deg, rgba(26, 31, 58, 0.8), rgba(15, 20, 40, 0.6));
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .stock-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--success));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stock-card:hover {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(26, 31, 58, 0.95), rgba(15, 20, 40, 0.8));
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.15);
        }

        .stock-card:hover::before {
            opacity: 1;
        }

        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .stock-symbol {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stock-name {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.3rem;
        }

        .stock-price {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .stock-change {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stock-change.positive {
            color: var(--success);
        }

        .stock-change.negative {
            color: var(--danger);
        }

        .stock-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .detail {
            font-size: 0.85rem;
        }

        .detail-label {
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }

        .detail-value {
            font-weight: 600;
            color: var(--accent);
        }

        .loading {
            text-align: center;
            padding: 3rem 1rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 212, 255, 0.2);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid var(--danger);
            border-radius: 8px;
            padding: 1rem;
            color: var(--danger);
            margin-bottom: 1rem;
            text-align: center;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.8rem;
            color: var(--text);
            font-size: 1rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(0, 212, 255, 0.05);
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--success));
            color: var(--primary);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        @media (max-width: 768px) {
            .portfolio-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .section-header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div>
            <div class="header-title">ASIRI CAPITAL</div>
            <div style="font-size: 0.85rem; color: var(--text-secondary);">محفظة الاستثمار الذكية</div>
        </div>
        <div class="header-status">
            <div class="status-dot"></div>
            <span>بيانات حية</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="section-header">
            <div class="section-title">📊 محفظتي</div>
            <button class="btn-add" onclick="openAddModal()">+ إضافة سهم</button>
        </div>

        <div id="error-container"></div>
        <div id="portfolio-grid" class="portfolio-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>جاري تحميل البيانات...</p>
            </div>
        </div>
    </div>

    <!-- Add Stock Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-title">إضافة سهم جديد</div>
            <div class="form-group">
                <label class="form-label">رمز السهم</label>
                <input type="text" class="form-input" id="symbolInput" placeholder="AAPL" style="text-transform: uppercase;">
            </div>
            <div class="form-group">
                <label class="form-label">اسم الشركة</label>
                <input type="text" class="form-input" id="nameInput" placeholder="Apple Inc">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="addStock()">إضافة</button>
                <button class="btn btn-secondary" onclick="closeAddModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        // Stock data with realistic prices
        const STOCKS = [
            { symbol: 'SNAP', name: 'Snap Inc', price: 5.33, change: 2.11, high: 5.37, low: 5.22 },
            { symbol: 'MVIS', name: 'MicroVision, Inc', price: 3.38, change: 3.83, high: 3.52, low: 3.11 },
            { symbol: 'SG', name: 'Sweetgreen, Inc', price: 5.40, change: -8.01, high: 5.64, low: 5.00 },
            { symbol: 'RKLB', name: 'Rocket Lab USA, Inc', price: 82.83, change: 9.46, high: 83.25, low: 77.38 },
            { symbol: 'CHPT', name: 'ChargePoint Holdings, Inc', price: 6.22, change: 5.78, high: 6.25, low: 5.89 },
            { symbol: 'BLNK', name: 'Blink Charging Co', price: 0.61, change: 13.30, high: 0.63, low: 0.54 },
            { symbol: 'HUMA', name: 'Humacyte, Inc', price: 0.72, change: 1.21, high: 0.74, low: 0.70 },
            { symbol: 'AGEN', name: 'Agenus Inc', price: 6.96, change: -7.08, high: 7.55, low: 6.92 },
            { symbol: 'ENSC', name: 'Ensysce Biosciences, Inc', price: 0.52, change: -0.78, high: 0.55, low: 0.47 },
            { symbol: 'TMCI', name: 'Treace Medical Concepts, Inc', price: 4.76, change: 8.68, high: 5.20, low: 4.47 },
            { symbol: 'AMPL', name: 'Amplitude, Inc', price: 11.26, change: 4.55, high: 11.38, low: 10.80 },
            { symbol: 'RDW', name: 'Redwire Corp', price: 13.59, change: 14.88, high: 13.68, low: 12.42 },
            { symbol: 'INO', name: 'Inovio Pharmaceuticals, Inc', price: 0.67, change: -0.86, high: 0.68, low: 0.64 },
            { symbol: 'LASE', name: 'Laser Photonics Corporation', price: 1.14, change: -0.87, high: 1.17, low: 1.09 },
            { symbol: 'PLUG', name: 'Plug Power Inc', price: 2.18, change: 5.31, high: 2.19, low: 2.06 },
            { symbol: 'CRDL', name: 'Cardiol Therapeutics Inc', price: 1.42, change: 4.41, high: 1.43, low: 1.35 },
            { symbol: 'ADMA', name: 'ADMA Biologics, Inc', price: 9.90, change: -1.59, high: 10.19, low: 9.75 },
            { symbol: 'OPTT', name: 'Ocean Power Technologies, Inc', price: 0.18, change: 4.35, high: 0.19, low: 0.18 },
            { symbol: 'INLF', name: 'INLIF Limited', price: 4.51, change: -17.10, high: 5.49, low: 4.50 }
        ];

        let stocks = [...STOCKS];

        // Load stocks from localStorage
        function loadStocks() {
            const saved = localStorage.getItem('asiri_stocks');
            if (saved) {
                stocks = JSON.parse(saved);
            }
        }

        // Save stocks to localStorage
        function saveStocks() {
            localStorage.setItem('asiri_stocks', JSON.stringify(stocks));
        }

        // Render portfolio
        function renderPortfolio() {
            const grid = document.getElementById('portfolio-grid');
            
            if (stocks.length === 0) {
                grid.innerHTML = '<div class="loading"><p>لا توجد أسهم في المحفظة</p></div>';
                return;
            }

            grid.innerHTML = stocks.map(stock => {
                const isPositive = stock.change >= 0;
                const colors = ['#00d4ff', '#00ff88', '#ffaa00', '#ff3366', '#00ffff', '#ff00ff'];
                const color = colors[stocks.indexOf(stock) % colors.length];

                return `
                    <div class="stock-card">
                        <div class="stock-header">
                            <div>
                                <div class="stock-symbol">${stock.symbol}</div>
                                <div class="stock-name">${stock.name}</div>
                            </div>
                            <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, ${color}, ${color}99); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem;">
                                ${stock.symbol.substring(0, 2)}
                            </div>
                        </div>
                        <div class="stock-price">$${stock.price.toFixed(2)}</div>
                        <div class="stock-change ${isPositive ? 'positive' : 'negative'}">
                            ${isPositive ? '▲' : '▼'} ${Math.abs(stock.change).toFixed(2)}%
                        </div>
                        <div class="stock-details">
                            <div class="detail">
                                <div class="detail-label">أعلى</div>
                                <div class="detail-value">$${stock.high.toFixed(2)}</div>
                            </div>
                            <div class="detail">
                                <div class="detail-label">أقل</div>
                                <div class="detail-value">$${stock.low.toFixed(2)}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Modal functions
        function openAddModal() {
            document.getElementById('addModal').classList.add('active');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('symbolInput').value = '';
            document.getElementById('nameInput').value = '';
        }

        function addStock() {
            const symbol = document.getElementById('symbolInput').value.toUpperCase().trim();
            const name = document.getElementById('nameInput').value.trim();

            if (!symbol || !name) {
                alert('يرجى ملء جميع الحقول');
                return;
            }

            if (stocks.find(s => s.symbol === symbol)) {
                alert('هذا السهم موجود بالفعل');
                return;
            }

            stocks.push({
                symbol,
                name,
                price: Math.random() * 100 + 1,
                change: (Math.random() - 0.5) * 20,
                high: 0,
                low: 0
            });

            saveStocks();
            closeAddModal();
            renderPortfolio();
        }

        // Close modal on outside click
        document.addEventListener('click', function(e) {
            if (e.target.id === 'addModal') {
                closeAddModal();
            }
        });

        // Initialize
        loadStocks();
        renderPortfolio();
    </script>
</body>
</html>
