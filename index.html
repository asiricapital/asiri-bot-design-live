<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asiri Capital - محفظة الاستثمار الذكية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1f3a;
            --secondary: #0f1428;
            --accent: #00d4ff;
            --success: #00ff88;
            --danger: #ff3366;
            --warning: #ffaa00;
            --text: #ffffff;
            --text-secondary: #a0aec0;
            --border: #2d3561;
        }

        body {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }

        .header {
            background: rgba(15, 20, 40, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent);
        }

        .btn-add {
            background: linear-gradient(135deg, var(--accent), var(--success));
            border: none;
            color: var(--primary);
            padding: 0.8rem 1.6rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .analytics-card {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 255, 136, 0.05));
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .analytics-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.8rem;
        }

        .analytics-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .analytics-change {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .analytics-change.positive {
            color: var(--success);
        }

        .analytics-change.negative {
            color: var(--danger);
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .stock-card {
            background: linear-gradient(135deg, rgba(26, 31, 58, 0.8), rgba(15, 20, 40, 0.6));
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stock-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--success));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stock-card:hover {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(26, 31, 58, 0.95), rgba(15, 20, 40, 0.8));
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.15);
        }

        .stock-card:hover::before {
            opacity: 1;
        }

        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .stock-symbol {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stock-name {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.3rem;
        }

        .stock-price {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .stock-change {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stock-change.positive {
            color: var(--success);
        }

        .stock-change.negative {
            color: var(--danger);
        }

        .stock-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .detail {
            font-size: 0.85rem;
        }

        .detail-label {
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }

        .detail-value {
            font-weight: 600;
            color: var(--accent);
        }

        .loading {
            text-align: center;
            padding: 3rem 1rem;
            grid-column: 1 / -1;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 212, 255, 0.2);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.8rem;
            color: var(--text);
            font-size: 1rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(0, 212, 255, 0.05);
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--success));
            color: var(--primary);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        @media (max-width: 768px) {
            .portfolio-grid {
                grid-template-columns: 1fr;
            }

            .analytics-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .section-header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div>
            <div class="header-title">ASIRI CAPITAL</div>
            <div style="font-size: 0.85rem; color: var(--text-secondary);">محفظة الاستثمار الذكية</div>
        </div>
        <div class="header-status">
            <div class="status-dot"></div>
            <span>بيانات حية ومحدثة</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Analytics Section -->
        <div id="analytics-section" style="display: none; margin-bottom: 2rem;">
            <div class="analytics-grid">
                <div class="analytics-card">
                    <div class="analytics-label">إجمالي قيمة المحفظة</div>
                    <div class="analytics-value" id="total-value">$0.00</div>
                    <div class="analytics-change" id="total-change">0%</div>
                </div>
                <div class="analytics-card">
                    <div class="analytics-label">الأرباح/الخسائر</div>
                    <div class="analytics-value" id="total-profit">$0.00</div>
                    <div class="analytics-change" id="profit-percent">0%</div>
                </div>
                <div class="analytics-card">
                    <div class="analytics-label">أسهم رابحة</div>
                    <div class="analytics-value" id="winning-count" style="color: var(--success);">0</div>
                </div>
                <div class="analytics-card">
                    <div class="analytics-label">أسهم خاسرة</div>
                    <div class="analytics-value" id="losing-count" style="color: var(--danger);">0</div>
                </div>
            </div>
        </div>

        <div class="section-header">
            <div class="section-title">📊 محفظتي</div>
            <button class="btn-add" onclick="openAddModal()">+ إضافة سهم</button>
        </div>

        <div id="portfolio-grid" class="portfolio-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>جاري جلب الأسعار المباشرة من السوق...</p>
            </div>
        </div>
    </div>

    <!-- Add Stock Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-title">إضافة سهم جديد</div>
            <div class="form-group">
                <label class="form-label">رمز السهم (مثل AAPL, TSLA)</label>
                <input type="text" class="form-input" id="symbolInput" placeholder="AAPL" style="text-transform: uppercase;">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="addStock()">إضافة ومتابعة</button>
                <button class="btn btn-secondary" onclick="closeAddModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const POLYGON_API_KEY = 'pp9Wp8ypugygYEp6YFkEssQIUjs90Wu8';
        
        const DEFAULT_STOCKS = [
            'SNAP', 'MVIS', 'SG', 'RKLB', 'CHPT',
            'BLNK', 'HUMA', 'AGEN', 'ENSC', 'TMCI',
            'AMPL', 'RDW', 'INO', 'LASE', 'PLUG',
            'CRDL', 'ADMA', 'OPTT', 'INLF'
        ];

        let stocks = [];
        let stocksData = {};

        function loadStocks() {
            const saved = localStorage.getItem('asiri_stocks');
            if (saved) {
                try {
                    stocks = JSON.parse(saved);
                } catch(e) {
                    stocks = [...DEFAULT_STOCKS];
                }
            } else {
                stocks = [...DEFAULT_STOCKS];
                saveStocks();
            }
        }

        function saveStocks() {
            localStorage.setItem('asiri_stocks', JSON.stringify(stocks));
        }

        // استخدام Polygon Previous Close API لضمان جلب آخر سعر إغلاق مؤكد بدون أخطاء تاريخية
        async function fetchStockData(symbol) {
            try {
                const url = `https://api.polygon.io/v2/aggs/ticker/${symbol}/prev?adjusted=true&apiKey=${POLYGON_API_KEY}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data && data.results && data.results.length > 0) {
                    const res = data.results[0];
                    const close = res.c;
                    const open = res.o;
                    const high = res.h;
                    const low = res.l;
                    const change = open ? ((close - open) / open) * 100 : 0;
                    
                    return {
                        symbol: symbol,
                        price: close,
                        high: high,
                        low: low,
                        change: change
                    };
                }
                return null;
            } catch (error) {
                console.error(`Error fetching ${symbol}:`, error);
                return null;
            }
        }

        async function fetchAllStocks() {
            const grid = document.getElementById('portfolio-grid');
            if (Object.keys(stocksData).length === 0) {
                grid.innerHTML = '<div class="loading"><div class="spinner"></div><p>جاري تحميل الأسعار الحية للمحفظة...</p></div>';
            }

            const newStocksData = {};
            for (const symbol of stocks) {
                const data = await fetchStockData(symbol);
                if (data) {
                    newStocksData[symbol] = data;
                } else if (stocksData[symbol]) {
                    // الاحتفاظ بالبيانات السابقة مؤقتاً في حال فشل الاتصال المؤقت
                    newStocksData[symbol] = stocksData[symbol];
                }
            }

            stocksData = newStocksData;
            renderPortfolio();
            updateAnalytics();
        }

        function calculateAnalytics() {
            let totalValue = 0;
            let winningCount = 0;
            let losingCount = 0;

            const values = Object.values(stocksData);
            values.forEach(stock => {
                totalValue += stock.price;
                if (stock.change > 0) {
                    winningCount++;
                } else if (stock.change < 0) {
                    losingCount++;
                }
            });

            const avgChange = values.length > 0
                ? values.reduce((sum, s) => sum + s.change, 0) / values.length
                : 0;

            return {
                totalValue,
                winningCount,
                losingCount,
                avgChange
            };
        }

        function updateAnalytics() {
            const analytics = calculateAnalytics();
            const analyticsSection = document.getElementById('analytics-section');
            const values = Object.values(stocksData);

            if (values.length > 0) {
                analyticsSection.style.display = 'block';

                document.getElementById('total-value').textContent = `$${analytics.totalValue.toFixed(2)}`;
                document.getElementById('winning-count').textContent = analytics.winningCount;
                document.getElementById('losing-count').textContent = analytics.losingCount;

                const changeElement = document.getElementById('total-change');
                changeElement.textContent = `${analytics.avgChange >= 0 ? '▲' : '▼'} ${Math.abs(analytics.avgChange).toFixed(2)}%`;
                changeElement.className = `analytics-change ${analytics.avgChange >= 0 ? 'positive' : 'negative'}`;

                const profitValue = document.getElementById('total-profit');
                const totalProfit = values.reduce((sum, s) => sum + (s.price * s.change / 100), 0);
                profitValue.textContent = `$${totalProfit.toFixed(2)}`;
                profitValue.style.color = totalProfit >= 0 ? 'var(--success)' : 'var(--danger)';

                const profitPercent = document.getElementById('profit-percent');
                const profitPercentValue = analytics.totalValue > 0 ? (totalProfit / analytics.totalValue) * 100 : 0;
                profitPercent.textContent = `${profitPercentValue >= 0 ? '▲' : '▼'} ${Math.abs(profitPercentValue).toFixed(2)}%`;
                profitPercent.className = `analytics-change ${profitPercentValue >= 0 ? 'positive' : 'negative'}`;
            } else {
                analyticsSection.style.display = 'none';
            }
        }

        function renderPortfolio() {
            const grid = document.getElementById('portfolio-grid');
            const values = Object.values(stocksData);
            
            if (values.length === 0) {
                grid.innerHTML = '<div class="loading"><p style="color: var(--danger);">عذراً، جاري الاتصال بالخادم لجلب الأسعار...</p></div>';
                return;
            }

            const colors = ['#00d4ff', '#00ff88', '#ffaa00', '#ff3366', '#00ffff', '#ff00ff'];
            
            grid.innerHTML = values.map((stock, index) => {
                const isPositive = stock.change >= 0;
                const color = colors[index % colors.length];

                return `
                    <div class="stock-card">
                        <div class="stock-header">
                            <div>
                                <div class="stock-symbol">${stock.symbol}</div>
                                <div class="stock-name">سهم أمريكي معتمد</div>
                            </div>
                            <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, ${color}, ${color}99); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem;">
                                ${stock.symbol.substring(0, 2)}
                            </div>
                        </div>
                        <div class="stock-price">$${stock.price.toFixed(2)}</div>
                        <div class="stock-change ${isPositive ? 'positive' : 'negative'}">
                            ${isPositive ? '▲' : '▼'} ${Math.abs(stock.change).toFixed(2)}%
                        </div>
                        <div class="stock-details">
                            <div class="detail">
                                <div class="detail-label">أعلى سعر</div>
                                <div class="detail-value">$${stock.high.toFixed(2)}</div>
                            </div>
                            <div class="detail">
                                <div class="detail-label">أقل سعر</div>
                                <div class="detail-value">$${stock.low.toFixed(2)}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openAddModal() {
            document.getElementById('addModal').classList.add('active');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('symbolInput').value = '';
        }

        async function addStock() {
            const symbol = document.getElementById('symbolInput').value.toUpperCase().trim();

            if (!symbol) {
                alert('يرجى إدخال رمز السهم');
                return;
            }

            if (stocks.includes(symbol)) {
                alert('هذا السهم موجود بالفعل في المحفظة');
                return;
            }

            const data = await fetchStockData(symbol);
            if (data) {
                stocks.push(symbol);
                saveStocks();
                stocksData[symbol] = data;
                closeAddModal();
                renderPortfolio();
                updateAnalytics();
                alert(`تمت إضافة السهم ${symbol} بنجاح وسعره الحالي $${data.price.toFixed(2)}`);
            } else {
                alert('تعذر جلب بيانات هذا السهم، تأكد من الرمز الصحيح');
            }
        }

        document.addEventListener('click', function(e) {
            if (e.target.id === 'addModal') {
                closeAddModal();
            }
        });

        loadStocks();
        fetchAllStocks();

        // تحديث دوري كل دقيقة
        setInterval(fetchAllStocks, 60 * 1000);
    </script>
</body>
</html>
