<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asiri Capital Intelligence OS - Mission Control Live</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --obsidian-black: #05080D;
            --obsidian-navy: #07111E;
            --obsidian-graphite: #0B1624;
            --obsidian-surface: #101E30;
            --obsidian-border: #1a2f47;
            
            --accent-gold: #e9bc55;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --accent-blue: #06b6d4;
            
            --text-primary: #f5f8fb;
            --text-secondary: #b0bcc9;
            --text-tertiary: #7a8999;
        }

        body {
            background-color: var(--obsidian-black);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--obsidian-navy) 0%, var(--obsidian-graphite) 100%);
            border-bottom: 1px solid var(--obsidian-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .header-status {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            padding-bottom: 120px;
        }

        .section-title {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--accent-blue);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stock-card {
            background: linear-gradient(135deg, var(--obsidian-navy) 0%, var(--obsidian-surface) 100%);
            border: 1px solid var(--obsidian-border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .stock-card:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 0 20px rgba(233, 188, 85, 0.1);
        }

        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--obsidian-border);
        }

        .stock-symbol {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .stock-name {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .stock-price {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .stock-change {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stock-change.positive {
            color: var(--accent-green);
        }

        .stock-change.negative {
            color: var(--accent-red);
        }

        .stock-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .detail-item {
            background: var(--obsidian-black);
            padding: 0.75rem;
            border-radius: 4px;
            border: 1px solid var(--obsidian-border);
        }

        .detail-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .detail-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .chart-container {
            position: relative;
            height: 200px;
            margin-top: 1rem;
        }

        .nav-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--obsidian-navy);
            border-top: 1px solid var(--obsidian-border);
            display: flex;
            justify-content: space-around;
            padding: 1rem 0;
            z-index: 99;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .nav-item:hover,
        .nav-item.active {
            color: var(--accent-blue);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .spinner {
            border: 3px solid var(--obsidian-border);
            border-top: 3px solid var(--accent-blue);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .last-update {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            margin-top: 1rem;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .portfolio-grid {
                grid-template-columns: 1fr;
            }

            body {
                padding-bottom: 100px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="status-indicator"></div>
            <div>
                <div class="header-title">ASIRI CAPITAL INTELLIGENCE OS</div>
                <div class="header-status">LIVE DATA - NASDAQ/NYSE</div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="section-title">المحفظة الحية</div>
        <div id="error-container"></div>
        <div class="portfolio-grid" id="portfolio-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>جاري تحميل البيانات الحية من NASDAQ/NYSE...</p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="nav-bottom">
        <div class="nav-item active">
            <div style="font-size: 1.5rem;">⌂</div>
            <div style="font-size: 0.75rem;">المحفظة</div>
        </div>
        <div class="nav-item">
            <div style="font-size: 1.5rem;">📊</div>
            <div style="font-size: 0.75rem;">الأسواق</div>
        </div>
        <div class="nav-item">
            <div style="font-size: 1.5rem;">🔔</div>
            <div style="font-size: 0.75rem;">التنبيهات</div>
        </div>
        <div class="nav-item">
            <div style="font-size: 1.5rem;">⚙️</div>
            <div style="font-size: 0.75rem;">الإعدادات</div>
        </div>
    </div>

    <script>
        // Alpha Vantage API Configuration
        const ALPHA_VANTAGE_API_KEY = 'SR8IZVAS9PQH763P';
        const API_BASE = 'https://www.alphavantage.co/query';
        
        // Stocks to track
        const STOCKS = [
            { symbol: 'CRDL', name: 'Cardiol Therapeutics Inc' },
            { symbol: 'AMPL', name: 'Amplitude, Inc' },
            { symbol: 'RDW', name: 'Redwire Corporation' },
            { symbol: 'ADMA', name: 'ADMA Biologics, Inc' },
            { symbol: 'RKLB', name: 'Rocket Lab USA, Inc' }
        ];

        // Store for historical data
        let stockData = {};

        // Initialize
        async function init() {
            await fetchAllStockData();
            setInterval(fetchAllStockData, 60000);
        }

        // Fetch all stock data with rate limiting
        async function fetchAllStockData() {
            const portfolioGrid = document.getElementById('portfolio-grid');
            const errorContainer = document.getElementById('error-container');
            
            try {
                let html = '';
                errorContainer.innerHTML = '';
                
                for (let i = 0; i < STOCKS.length; i++) {
                    const stock = STOCKS[i];
                    
                    if (i > 0) {
                        await new Promise(resolve => setTimeout(resolve, 1200));
                    }

                    try {
                        const data = await fetchStockData(stock.symbol);
                        
                        if (data.error) {
                            html += `
                                <div class="stock-card">
                                    <div class="stock-symbol">${stock.symbol}</div>
                                    <p style="color: var(--accent-red);">${data.error}</p>
                                </div>
                            `;
                            continue;
                        }

                        const isPositive = data.change >= 0;
                        
                        html += `
                            <div class="stock-card">
                                <div class="stock-header">
                                    <div>
                                        <div class="stock-symbol">${stock.symbol}</div>
                                        <div class="stock-name">${stock.name}</div>
                                    </div>
                                </div>
                                
                                <div class="stock-price">$${data.price.toFixed(2)}</div>
                                <div class="stock-change ${isPositive ? 'positive' : 'negative'}">
                                    ${isPositive ? '▲' : '▼'} ${data.change.toFixed(2)}% (${data.changeAmount.toFixed(4)})
                                </div>

                                <div class="stock-details">
                                    <div class="detail-item">
                                        <div class="detail-label">أعلى اليوم</div>
                                        <div class="detail-value">$${data.high.toFixed(2)}</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">أقل اليوم</div>
                                        <div class="detail-value">$${data.low.toFixed(2)}</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">الحجم</div>
                                        <div class="detail-value">${(data.volume / 1000000).toFixed(2)}M</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">التغير</div>
                                        <div class="detail-value" style="color: ${isPositive ? 'var(--accent-green)' : 'var(--accent-red)'}">
                                            ${isPositive ? '+' : ''}${data.change.toFixed(2)}%
                                        </div>
                                    </div>
                                </div>

                                <div class="chart-container">
                                    <canvas id="chart-${stock.symbol}"></canvas>
                                </div>

                                <div class="last-update">
                                    آخر تحديث: ${new Date(data.timestamp).toLocaleTimeString('ar-SA')}
                                </div>
                            </div>
                        `;

                        stockData[stock.symbol] = data;

                    } catch (error) {
                        console.error(`خطأ في جلب بيانات ${stock.symbol}:`, error);
                        html += `
                            <div class="stock-card">
                                <div class="stock-symbol">${stock.symbol}</div>
                                <p style="color: var(--accent-red);">خطأ في تحميل البيانات</p>
                            </div>
                        `;
                    }
                }

                portfolioGrid.innerHTML = html;

                for (const symbol in stockData) {
                    if (stockData[symbol].intraday) {
                        drawChart(symbol, stockData[symbol].intraday);
                    }
                }

            } catch (error) {
                console.error('خطأ في جلب البيانات:', error);
                errorContainer.innerHTML = `
                    <div class="error-message">
                        ⚠️ خطأ في تحميل البيانات. يرجى المحاولة لاحقاً.
                    </div>
                `;
            }
        }

        // Fetch stock data from Alpha Vantage
        async function fetchStockData(symbol) {
            try {
                const quoteResponse = await fetch(
                    `${API_BASE}?function=GLOBAL_QUOTE&symbol=${symbol}&apikey=${ALPHA_VANTAGE_API_KEY}`
                );
                const quoteData = await quoteResponse.json();

                if (quoteData.Note || quoteData.Information) {
                    return { error: 'حد أقصى للطلبات - يرجى المحاولة لاحقاً' };
                }

                if (!quoteData['Global Quote'] || !quoteData['Global Quote']['05. price']) {
                    return { error: 'لم يتم العثور على البيانات' };
                }

                const quote = quoteData['Global Quote'];
                const price = parseFloat(quote['05. price']);
                const change = parseFloat(quote['10. change percent']) || 0;
                const changeAmount = parseFloat(quote['09. change']) || 0;
                const high = parseFloat(quote['03. high']) || price;
                const low = parseFloat(quote['04. low']) || price;
                const volume = parseInt(quote['06. volume']) || 0;
                const timestamp = quote['07. latest trading day'] || new Date().toISOString();

                const intradayResponse = await fetch(
                    `${API_BASE}?function=TIME_SERIES_INTRADAY&symbol=${symbol}&interval=60min&apikey=${ALPHA_VANTAGE_API_KEY}`
                );
                const intradayData = await intradayResponse.json();

                let intradayPrices = [];
                if (intradayData['Time Series (60min)']) {
                    const timeSeries = intradayData['Time Series (60min)'];
                    const times = Object.keys(timeSeries).slice(0, 24).reverse();
                    intradayPrices = times.map(time => parseFloat(timeSeries[time]['4. close']));
                }

                return {
                    price,
                    change,
                    changeAmount,
                    high,
                    low,
                    volume,
                    timestamp,
                    intraday: intradayPrices
                };

            } catch (error) {
                console.error(`خطأ في جلب ${symbol}:`, error);
                return { error: 'خطأ في الاتصال' };
            }
        }

        // Draw chart for stock
        function drawChart(symbol, prices) {
            const canvas = document.getElementById(`chart-${symbol}`);
            if (!canvas || prices.length === 0) return;

            const ctx = canvas.getContext('2d');
            
            if (window.charts && window.charts[symbol]) {
                window.charts[symbol].destroy();
            }

            if (!window.charts) window.charts = {};

            const isPositive = prices[prices.length - 1] >= prices[0];
            
            window.charts[symbol] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array.from({length: prices.length}, (_, i) => `${i}h`),
                    datasets: [{
                        label: symbol,
                        data: prices,
                        borderColor: isPositive ? '#10b981' : '#ef4444',
                        backgroundColor: isPositive ? 'rgba(16, 185, 129, 0.1)' : 'rgba(239, 68, 68, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 6,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            display: false,
                            beginAtZero: false
                        },
                        x: {
                            display: false
                        }
                    }
                }
            });
        }

        init();
    </script>
</body>
</html>
