<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asiri Capital - Live Portfolio Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e27;
            --bg-darker: #050810;
            --card-bg: #0f1429;
            --border-color: #1a2847;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-gold: #fbbf24;
        }

        body {
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow-x: hidden;
        }

        .header {
            background: rgba(15, 20, 41, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header-title {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-status {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            padding-bottom: 100px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--accent-blue);
        }

        .add-stock-btn {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-gold) 100%);
            border: none;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .add-stock-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }

        .portfolio-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .stock-item {
            background: linear-gradient(135deg, rgba(15, 20, 41, 0.8) 0%, rgba(26, 40, 71, 0.4) 100%);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .stock-item:hover {
            border-color: var(--accent-blue);
            background: linear-gradient(135deg, rgba(15, 20, 41, 0.95) 0%, rgba(26, 40, 71, 0.6) 100%);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
        }

        .stock-left {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
        }

        .stock-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-gold) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: white;
            flex-shrink: 0;
        }

        .stock-info {
            flex: 1;
        }

        .stock-symbol {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .stock-name {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .stock-right {
            display: flex;
            align-items: flex-end;
            gap: 1.5rem;
            text-align: right;
        }

        .stock-price {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .price-value {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .price-change {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.3rem;
        }

        .price-change.positive {
            color: var(--accent-green);
        }

        .price-change.negative {
            color: var(--accent-red);
        }

        .stock-details {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .detail-badge {
            background: rgba(59, 130, 246, 0.1);
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.05);
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-gold) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .spinner {
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top: 3px solid var(--accent-blue);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .stock-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .stock-right {
                width: 100%;
                justify-content: space-between;
                text-align: left;
                margin-top: 1rem;
                padding-top: 1rem;
                border-top: 1px solid var(--border-color);
            }

            .stock-details {
                width: 100%;
                flex-wrap: wrap;
            }

            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="status-dot"></div>
            <div>
                <div class="header-title">ASIRI CAPITAL</div>
                <div class="header-status">LIVE PORTFOLIO</div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="section-header">
            <div class="section-title">📊 محفظتي</div>
            <button class="add-stock-btn" onclick="openAddModal()">+ إضافة سهم</button>
        </div>

        <div id="error-container"></div>
        <div class="portfolio-list" id="portfolio-list">
            <div class="loading">
                <div class="spinner"></div>
                <p>جاري تحميل البيانات الحية...</p>
            </div>
        </div>
    </div>

    <!-- Add Stock Modal -->
    <div class="modal" id="addStockModal">
        <div class="modal-content">
            <div class="modal-title">إضافة سهم جديد</div>
            <div class="form-group">
                <label class="form-label">رمز السهم (مثال: AAPL)</label>
                <input type="text" class="form-input" id="newStockSymbol" placeholder="أدخل رمز السهم" style="text-transform: uppercase;">
            </div>
            <div class="form-group">
                <label class="form-label">اسم الشركة</label>
                <input type="text" class="form-input" id="newStockName" placeholder="أدخل اسم الشركة">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="addNewStock()">إضافة</button>
                <button class="btn btn-secondary" onclick="closeAddModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        // Alpha Vantage API Configuration
        const ALPHA_VANTAGE_API_KEY = 'SR8IZVAS9PQH763P';
        const API_BASE = 'https://www.alphavantage.co/query';

        // Default stocks
        let STOCKS = [
            { symbol: 'SNAP', name: 'Snap Inc' },
            { symbol: 'MVIS', name: 'MicroVision, Inc' },
            { symbol: 'SG', name: 'Sweetgreen, Inc' },
            { symbol: 'RKLB', name: 'Rocket Lab USA, Inc' },
            { symbol: 'CHPT', name: 'ChargePoint Holdings, Inc' },
            { symbol: 'BLNK', name: 'Blink Charging Co' },
            { symbol: 'HUMA', name: 'Humacyte, Inc' },
            { symbol: 'AGEN', name: 'Agenus Inc' },
            { symbol: 'ENSC', name: 'Ensysce Biosciences, Inc' },
            { symbol: 'TMCI', name: 'Treace Medical Concepts, Inc' },
            { symbol: 'AMPL', name: 'Amplitude, Inc' },
            { symbol: 'OCCN', name: 'Ocugen, Inc' },
            { symbol: 'RDW', name: 'Redwire Corp' },
            { symbol: 'INO', name: 'Inovio Pharmaceuticals, Inc' },
            { symbol: 'LASE', name: 'Laser Photonics Corporation' },
            { symbol: 'PLUG', name: 'Plug Power Inc' },
            { symbol: 'CRDL', name: 'Cardiol Therapeutics Inc' },
            { symbol: 'ADMA', name: 'ADMA Biologics, Inc' },
            { symbol: 'OPTT', name: 'Ocean Power Technologies, Inc' },
            { symbol: 'INLF', name: 'INLIF Limited' }
        ];

        let stockData = {};

        // Load stocks from localStorage
        function loadStocks() {
            const saved = localStorage.getItem('asiri_stocks');
            if (saved) {
                STOCKS = JSON.parse(saved);
            }
        }

        // Save stocks to localStorage
        function saveStocks() {
            localStorage.setItem('asiri_stocks', JSON.stringify(STOCKS));
        }

        // Initialize
        async function init() {
            loadStocks();
            await fetchAllStocks();
            setInterval(fetchAllStocks, 60000);
        }

        // Fetch all stocks
        async function fetchAllStocks() {
            const portfolioList = document.getElementById('portfolio-list');
            const errorContainer = document.getElementById('error-container');

            try {
                let html = '';
                errorContainer.innerHTML = '';

                for (let i = 0; i < STOCKS.length; i++) {
                    const stock = STOCKS[i];
                    
                    if (i > 0) {
                        await new Promise(resolve => setTimeout(resolve, 1200));
                    }

                    try {
                        const data = await fetchStockData(stock.symbol);
                        
                        if (data.error) {
                            html += `
                                <div class="stock-item">
                                    <div class="stock-left">
                                        <div class="stock-icon" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);">
                                            ${stock.symbol.substring(0, 2)}
                                        </div>
                                        <div class="stock-info">
                                            <div class="stock-symbol">${stock.symbol}</div>
                                            <div class="stock-name">${stock.name}</div>
                                        </div>
                                    </div>
                                    <div style="color: #ef4444; font-size: 0.9rem;">خطأ في التحميل</div>
                                </div>
                            `;
                            continue;
                        }

                        const isPositive = data.change >= 0;
                        const colors = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#14b8a6', '#f97316', '#6366f1', '#d946ef'];
                        const colorIndex = STOCKS.indexOf(stock) % colors.length;
                        const bgColor = colors[colorIndex];

                        html += `
                            <div class="stock-item">
                                <div class="stock-left">
                                    <div class="stock-icon" style="background: linear-gradient(135deg, ${bgColor} 0%, ${bgColor}dd 100%);">
                                        ${stock.symbol.substring(0, 2)}
                                    </div>
                                    <div class="stock-info">
                                        <div class="stock-symbol">${stock.symbol}</div>
                                        <div class="stock-name">${stock.name}</div>
                                    </div>
                                </div>
                                <div class="stock-right">
                                    <div class="stock-price">
                                        <div class="price-value">$${data.price.toFixed(2)}</div>
                                        <div class="price-change ${isPositive ? 'positive' : 'negative'}">
                                            ${isPositive ? '▲' : '▼'} ${Math.abs(data.change).toFixed(2)}%
                                        </div>
                                    </div>
                                    <div class="stock-details">
                                        <div class="detail-badge">أعلى: $${data.high.toFixed(2)}</div>
                                        <div class="detail-badge">أقل: $${data.low.toFixed(2)}</div>
                                    </div>
                                </div>
                            </div>
                        `;

                        stockData[stock.symbol] = data;

                    } catch (error) {
                        console.error(`خطأ في جلب ${stock.symbol}:`, error);
                    }
                }

                portfolioList.innerHTML = html || '<div class="loading"><p>لا توجد بيانات</p></div>';

            } catch (error) {
                console.error('خطأ:', error);
                errorContainer.innerHTML = `<div class="error-message">⚠️ خطأ في تحميل البيانات</div>`;
            }
        }

        // Fetch stock data
        async function fetchStockData(symbol) {
            try {
                const response = await fetch(
                    `${API_BASE}?function=GLOBAL_QUOTE&symbol=${symbol}&apikey=${ALPHA_VANTAGE_API_KEY}`
                );
                const data = await response.json();

                if (data.Note || data.Information) {
                    return { error: 'حد أقصى للطلبات' };
                }

                if (!data['Global Quote'] || !data['Global Quote']['05. price']) {
                    return { error: 'لم يتم العثور على البيانات' };
                }

                const quote = data['Global Quote'];
                return {
                    price: parseFloat(quote['05. price']),
                    change: parseFloat(quote['10. change percent']) || 0,
                    high: parseFloat(quote['03. high']) || parseFloat(quote['05. price']),
                    low: parseFloat(quote['04. low']) || parseFloat(quote['05. price']),
                    volume: parseInt(quote['06. volume']) || 0
                };

            } catch (error) {
                console.error(`خطأ في جلب ${symbol}:`, error);
                return { error: 'خطأ في الاتصال' };
            }
        }

        // Modal functions
        function openAddModal() {
            document.getElementById('addStockModal').classList.add('active');
        }

        function closeAddModal() {
            document.getElementById('addStockModal').classList.remove('active');
            document.getElementById('newStockSymbol').value = '';
            document.getElementById('newStockName').value = '';
        }

        function addNewStock() {
            const symbol = document.getElementById('newStockSymbol').value.toUpperCase().trim();
            const name = document.getElementById('newStockName').value.trim();

            if (!symbol || !name) {
                alert('يرجى ملء جميع الحقول');
                return;
            }

            if (STOCKS.find(s => s.symbol === symbol)) {
                alert('هذا السهم موجود بالفعل');
                return;
            }

            STOCKS.push({ symbol, name });
            saveStocks();
            closeAddModal();
            fetchAllStocks();
        }

        // Close modal on outside click
        document.getElementById('addStockModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeAddModal();
            }
        });

        // Start
        init();
    </script>
</body>
</html>
