name: Asiri primary to VIP backup

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asiri-primary-to-vip-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository_owner == 'asiricapital'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Backup all branches and tags to VIP7733661
        shell: bash
        env:
          SOURCE_TOKEN: ${{ github.token }}
          BACKUP_TOKEN: ${{ secrets.VIP7733661_BACKUP_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${BACKUP_TOKEN:-}" ]; then
            echo "VIP7733661_BACKUP_TOKEN is not configured."
            exit 1
          fi

          repo_name="${GITHUB_REPOSITORY#*/}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          git clone --bare \
            "https://x-access-token:${SOURCE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$workdir/source.git"

          cd "$workdir/source.git"
          git remote add backup \
            "https://x-access-token:${BACKUP_TOKEN}@github.com/vip7733661/${repo_name}.git"

          # احتفظ بسجل VIP الحالي كما هو؛ لا تكتب فوق main أو أي فرع فيه.
          # تحفظ فروع المصدر تحت مساحة أسماء منفصلة قابلة للتدقيق.
          git for-each-ref --format='%(refname)' refs/heads/ | while IFS= read -r ref; do
            branch="${ref#refs/heads/}"
            git push backup "$ref:refs/heads/asiricapital-backup/$branch"
          done
          git push backup --tags
