<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asiri Capital Live</title>
<style>
:root{--bg:#07101f;--card:#0d1728;--card2:#111e32;--line:#22314b;--text:#f7fbff;--muted:#91a1ba;--green:#25d695;--red:#ff6578;--blue:#4db8ff;--gold:#f7c948}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#12223c 0,#07101f 38%,#040914 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}.top{position:sticky;top:0;z-index:10;background:rgba(7,16,31,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px 18px}.toprow,.statusrow{max-width:1320px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:11px;align-items:center}.dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 18px var(--green)}h1{font-size:18px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.pill{border:1px solid var(--line);background:#0d1728;padding:7px 10px;border-radius:999px;font-size:12px;color:var(--muted)}.wrap{max-width:1320px;margin:auto;padding:20px 16px 60px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-bottom:16px}.panel{background:linear-gradient(180deg,rgba(17,30,50,.95),rgba(10,18,31,.95));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.22)}.heroTitle{font-size:14px;color:var(--muted)}.heroValue{font-size:30px;font-weight:800;margin:8px 0}.marketgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:12px;border-radius:14px;background:#0a1424;border:1px solid #1d2d46}.metric b{display:block;margin-top:5px;font-size:17px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.controls input{flex:1;min-width:180px;background:#081321;border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:12px;outline:none}.controls button{border:0;border-radius:12px;padding:12px 15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--blue),#356cff);color:white}.controls .ghost{background:#101c2e;border:1px solid var(--line);color:var(--text)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stock{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:17px;padding:15px;transition:.2s}.stock:hover{transform:translateY(-2px);border-color:#355176}.stockhead{display:flex;justify-content:space-between;gap:12px}.sym{font-size:20px;font-weight:900;letter-spacing:.5px}.name{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}.price{font-size:24px;font-weight:800;margin-top:16px}.chg{font-size:13px;margin-top:5px;font-weight:700}.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--muted)}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.detail{font-size:11px;color:var(--muted);background:#091321;border:1px solid #1a2940;padding:9px;border-radius:10px}.detail strong{display:block;color:var(--text);font-size:13px;margin-top:2px}.source{margin-top:12px;font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.livebadge{color:var(--green)}.error{color:var(--red);font-size:12px;margin-top:14px}.empty{text-align:center;color:var(--muted);padding:40px}.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:780px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.marketgrid{grid-template-columns:1fr 1fr}.heroValue{font-size:25px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.marketgrid{grid-template-columns:1fr}.statusrow{align-items:flex-start;flex-direction:column}.controls input{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="toprow"><div class="brand"><span class="dot"></span><div><h1>ASIRI CAPITAL</h1><div class="sub">LIVE MARKET TERMINAL</div></div></div><div id="clock" class="pill">جاري الاتصال…</div></div></header>
<main class="wrap">
<section class="hero"><div class="panel"><div class="heroTitle">حالة البث</div><div id="feedStatus" class="heroValue">جاري تحميل الأسعار الحية…</div><div class="sub" id="feedNote">المصدر الأساسي: Yahoo Finance عبر خادم Asiri Capital، مع تحديث دوري كل 10 ثوانٍ.</div></div><div class="panel"><div class="heroTitle">نبض السوق</div><div id="marketGrid" class="marketgrid"><div class="metric">S&P 500<b>—</b></div><div class="metric">Nasdaq<b>—</b></div><div class="metric">VIX<b>—</b></div></div></div></section>
<div class="controls"><input id="symbolInput" maxlength="12" placeholder="أضف رمز سهم مثل PLUG أو ADMA" /><button id="addBtn">إضافة سهم</button><button id="refreshBtn" class="ghost">تحديث الآن</button><button id="resetBtn" class="ghost">استعادة القائمة</button></div>
<section id="stockGrid" class="grid"></section><div class="footer">Asiri Capital • الأسعار لأغراض المتابعة والتحليل وليست أمر تنفيذ تداول.</div>
</main>
<script>
const DEFAULTS=['SNAP','MVIS','SG','RKLB','CHPT','BLNK','HUMA','AGEN','ENSC','TMCI','AMPL','OCGN','RDW','INO','LASE','PLUG','CRDL','ADMA','OPTT','KULR'];
const KEY='asiri_live_symbols_v1';let symbols=JSON.parse(localStorage.getItem(KEY)||'null')||DEFAULTS;let quotes=new Map();let busy=false;
const grid=document.getElementById('stockGrid'),feed=document.getElementById('feedStatus'),note=document.getElementById('feedNote'),clock=document.getElementById('clock');
const fmt=n=>Number.isFinite(Number(n))?Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
const pct=n=>Number.isFinite(Number(n))?`${Number(n)>=0?'+':''}${Number(n).toFixed(2)}%`:'—';
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function card(s){const q=quotes.get(s);if(!q)return `<article class="stock"><div class="sym">${esc(s)}</div><div class="sub">جاري التحميل…</div></article>`;if(q.error)return `<article class="stock"><div class="sym">${esc(s)}</div><div class="error">${esc(q.error)}</div></article>`;const c=Number(q.changePercent),cls=c>0?'up':c<0?'down':'flat';return `<article class="stock"><div class="stockhead"><div><div class="sym">${esc(q.symbol||s)}</div><div class="name">${esc(q.name||'')}</div></div><button onclick="removeSymbol('${esc(s)}')" title="حذف" style="background:none;border:0;color:#91a1ba;cursor:pointer">✕</button></div><div class="price">$${fmt(q.price)}</div><div class="chg ${cls}">${pct(c)} ${c>0?'▲':c<0?'▼':'•'}</div><div class="details"><div class="detail">أعلى اليوم<strong>$${fmt(q.high)}</strong></div><div class="detail">أدنى اليوم<strong>$${fmt(q.low)}</strong></div><div class="detail">الإغلاق السابق<strong>$${fmt(q.previousClose)}</strong></div><div class="detail">الحجم<strong>${Number.isFinite(Number(q.volume))?Number(q.volume).toLocaleString('en-US'):'—'}</strong></div></div><div class="source"><span>${esc(q.sessionLabel||q.session||'')}</span><span class="${q.isLiveSession?'livebadge':''}">${q.isLiveSession?'LIVE':'LATEST'}</span></div><div class="source"><span>${esc(q.source||'Yahoo Finance')}</span><span>${q.updatedAt?new Date(q.updatedAt).toLocaleTimeString('ar-SA'):''}</span></div></article>`}
function render(){grid.innerHTML=symbols.map(card).join('')||'<div class="empty">لا توجد أسهم في القائمة</div>'}
async function refresh(){if(busy||!symbols.length)return;busy=true;feed.textContent='جاري تحديث الأسعار…';render();try{const r=await fetch('/api/quotes?symbols='+encodeURIComponent(symbols.join(','))+'&_='+Date.now(),{cache:'no-store'});const rows=await r.json();if(!r.ok)throw new Error(rows.error||'تعذر الاتصال بالخادم');for(const q of rows)quotes.set(q.symbol,q);feed.textContent='الأسعار محدثة';note.textContent='آخر تحديث '+new Date().toLocaleTimeString('ar-SA')+' • تحديث تلقائي كل 10 ثوانٍ';render()}catch(e){feed.textContent='تعذر تحديث الأسعار';note.textContent=e.message}finally{busy=false}}
async function refreshMarket(){try{const r=await fetch('/api/market?_='+Date.now(),{cache:'no-store'}),d=await r.json();const pick=s=>(d.rows||[]).find(x=>x.symbol===s)||{};const a=pick('^GSPC'),b=pick('^IXIC'),v=pick('^VIX');document.getElementById('marketGrid').innerHTML=`<div class="metric">S&P 500<b>${fmt(a.price)} <span class="${Number(a.changePercent)>=0?'up':'down'}">${pct(a.changePercent)}</span></b></div><div class="metric">Nasdaq<b>${fmt(b.price)} <span class="${Number(b.changePercent)>=0?'up':'down'}">${pct(b.changePercent)}</span></b></div><div class="metric">VIX<b>${fmt(v.price)}</b></div>`}catch{}}
function save(){localStorage.setItem(KEY,JSON.stringify(symbols))}
window.removeSymbol=s=>{symbols=symbols.filter(x=>x!==s);quotes.delete(s);save();render()};
document.getElementById('addBtn').onclick=()=>{const el=document.getElementById('symbolInput'),s=el.value.trim().toUpperCase().replace(/[^A-Z0-9.\-]/g,'');if(s&&!symbols.includes(s)){symbols.unshift(s);symbols=symbols.slice(0,40);save();el.value='';render();refresh()}};
document.getElementById('symbolInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('addBtn').click()});
document.getElementById('refreshBtn').onclick=()=>{refresh();refreshMarket()};document.getElementById('resetBtn').onclick=()=>{symbols=[...DEFAULTS];quotes.clear();save();render();refresh()};
setInterval(()=>clock.textContent=new Date().toLocaleString('ar-SA'),1000);render();refresh();refreshMarket();setInterval(refresh,10000);setInterval(refreshMarket,60000);
</script>
</body></html>
